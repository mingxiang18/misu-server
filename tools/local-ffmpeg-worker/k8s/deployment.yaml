apiVersion: apps/v1
kind: Deployment
metadata:
  name: misu-ffmpeg-worker
  namespace: misu-server
  labels:
    app: misuffmpegworker
spec:
  replicas: 1
  # 与 misu-file-server 同样的 Recreate —— transcode-queue 是 hostPath 上
  # 文件锁，不能两个 pod 同时 mv 同一个 .task 进 running/。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: misuffmpegworker
  template:
    metadata:
      labels:
        app: misuffmpegworker
    spec:
      # 必须和 misu-file-server pod 落在同一节点，hostPath 才指向同一份磁盘。
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [misu-maco]
      # 给 ffmpeg 留 60s grace period，让 worker 的 SIGTERM trap 把
      # running/ 任务退回 queue/ 再退。
      terminationGracePeriodSeconds: 60
      # /dev/dri/renderD128 在不同发行版属于不同 group：
      #   - Ubuntu 26.04 (misu-maco): render(gid 990)
      #   - Debian 12 / Ubuntu 22+: render(gid 109)
      #   - Alpine: video(44) 通常够用
      #   - Fedora: render(989)
      # 容器默认以 root 跑（Dockerfile 没 USER 指令），其实不依赖 group 就能访问设备；
      # 但保留 supplementalGroups 是 hardening，将来如果改成非 root 跑也能直接用。
      # 节点上查询实际 gid：`ls -ln /dev/dri/renderD128`，第 4 列是 gid。
      securityContext:
        supplementalGroups: [44, 27, 107, 109, 110, 989, 990]
      containers:
        - name: misu-ffmpeg-worker
          image: 10.8.0.26:30500/misuaa/misu-ffmpeg-worker:0.0.8
          imagePullPolicy: IfNotPresent
          # privileged 用来打开 device cgroup —— k8s 默认即便 hostPath 把
          # /dev/dri/renderD128 挂进来，字符设备 cgroup 仍然 deny。
          # 单 pod 单节点风险可控；要更精细可换 generic-device-plugin。
          securityContext:
            privileged: true
          ports:
            - { name: api, containerPort: 18765 }
          envFrom:
            - configMapRef:
                name: misu-ffmpeg-worker-config
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            # namespace 的 LimitRange 卡 max cpu=2,与 misu-file-server 同款
            limits:   { cpu: 2,    memory: 2Gi  }
          startupProbe:
            httpGet: { path: /api/health, port: 18765 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /api/health, port: 18765 }
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /api/health, port: 18765 }
            periodSeconds: 10
          volumeMounts:
            - { name: user-file, mountPath: /data/user-file }
            - { name: scratch,   mountPath: /work }
            - { name: state,     mountPath: /work/state }
            # /dev/dri 默认挂上。节点没 GPU 时 detect-encoder.sh 的 testsrc dry-encode
            # 会失败，自动回退到 libx265 软编，无副作用。要彻底关掉 GPU 这一条尝试，
            # 注释掉下行 + volumes 里对应 dri 块。
            - { name: dri,       mountPath: /dev/dri }
      volumes:
        - name: user-file
          hostPath:
            path: /mnt/misu/misu-server/user-file
            type: Directory
        - name: scratch
          emptyDir:
            sizeLimit: 8Gi
        - name: state
          hostPath:
            path: /mnt/misu/misu-server/transcode-state
            type: DirectoryOrCreate
        # AMD Radeon iGPU/dGPU 走 VAAPI 通过这个挂载暴露给容器。
        # NVIDIA 不走 /dev/dri，需要额外装 nvidia-container-toolkit + 加 runtimeClassName。
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
