apiVersion: v1
kind: Secret
metadata:
  name: misu-ops-qbittorrent
  namespace: misu-server
type: Opaque
stringData:
  # The fixed in-cluster qBittorrent Service URL. Do not use a client supplied
  # value and do not put this Secret in a ConfigMap or browser bundle.
  url: "REPLACE_WITH_FIXED_QBITTORRENT_SERVICE_URL"
  username: "REPLACE_WITH_QBITTORRENT_USERNAME"
  password: "REPLACE_WITH_QBITTORRENT_PASSWORD"
