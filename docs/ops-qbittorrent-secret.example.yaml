apiVersion: v1
kind: Secret
metadata:
  name: misu-ops-qbittorrent
  namespace: misu-server
type: Opaque
stringData:
  # The upstream URL is fixed in misu-ops code to the existing
  # q-bit-torrent-pi Service on port 30120. This Secret stores credentials only.
  # This repository has no qBittorrent Service manifest; verify that Service
  # name and port during deployment acceptance before enabling the console.
  username: "REPLACE_WITH_QBITTORRENT_USERNAME"
  password: "REPLACE_WITH_QBITTORRENT_PASSWORD"
