apiVersion: v1
kind: Secret
metadata:
  name: misu-ops-database
  namespace: misu-server
type: Opaque
stringData:
  # Set to "true" only when all connection fields below are present.
  # The Deployment references this key optionally, so a missing Secret keeps
  # the database capability disabled by application.yml's false default.
  enabled: "true"
  username: "REPLACE_WITH_OPS_DATABASE_USERNAME"
  password: "REPLACE_WITH_OPS_DATABASE_PASSWORD"
  # Comma-separated schema allowlist, for example: misu_ops_test
  allowed-schemas: "REPLACE_WITH_ALLOWED_SCHEMA_NAMES"
