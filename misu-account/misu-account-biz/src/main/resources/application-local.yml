# Spring
spring:
  config:
    import: optional:nacos:misu-account-local.yml
  cloud:
    nacos:
      # 本地开发：指向 dev.sh 启动的本机 Nacos 容器
      username: nacos
      password: nacos
      discovery:
        # 服务注册地址
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 命名空间
        namespace: local
        # 组名
        group: DEFAULT_GROUP
        # 指定网卡
#        network-interface: tun0
      config:
        import-check:
          enabled: false
        # 配置中心地址
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 命名空间
        namespace: local
        # 组名
        group: DEFAULT_GROUP
        # 配置文件格式
        file-extension: yml
