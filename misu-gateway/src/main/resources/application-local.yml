# Spring
spring:
  config:
    import: optional:nacos:misu-gateway-local.yml
  cloud:
    nacos:
      # 本地开发：指向 dev.sh 启动的本机 Nacos 容器
      username: nacos
      password: nacos
      discovery:
        # 服务注册地址
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 命名空间
        namespace: local
        # 组名
        group: DEFAULT_GROUP
        # 指定网卡
#        network-interface: tun0
      config:
        import-check:
          enabled: false
        # 配置中心地址
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        # 命名空间
        namespace: local
        # 组名
        group: DEFAULT_GROUP
        # 配置文件格式
        file-extension: yml

    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: misu-account
          uri: lb://misu-account
          predicates:
            - Path=/account/**

        - id: misu-file-server-video-room-ws
          uri: lb:ws://misu-file-server
          predicates:
            - Path=/fileServer/videoRoom/ws/**

        - id: misu-file-server
          uri: lb://misu-file-server
          predicates:
            - Path=/fileServer/**
      # 允许跨域
      globalcors:
        cors-configurations:
            '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600

    # 本地开发禁用 Sentinel transport（不起 dashboard 容器）
    # 如需启用：把 enabled 改为 true，启动 Sentinel dashboard 容器，并恢复下方 transport / datasource 配置
    sentinel:
      enabled: false
      eager: false
#      transport:
#        dashboard: localhost:8858
#        port: 30270
#        clientIp: 127.0.0.1
#      datasource:
#        ds1:
#          nacos:
#            server-addr: localhost:8848
#            dataId: sentinel-misu-gateway-local.json
#            namespace: local
#            groupId: DEFAULT_GROUP
#            data-type: json
#            rule-type: flow
      scg:
        fallback:
          response-status: 429
          mode: response
          response-body: '{"code": 429,"message": "当前系统拥堵，请稍后再试！"}'
