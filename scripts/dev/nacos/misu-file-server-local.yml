# Nacos 配置：dataId = misu-file-server-local.yml, namespace = local, group = DEFAULT_GROUP
# 由 scripts/dev/dev.sh seed-nacos 推送到本机 Nacos
# 仅供本地开发，账号密码均为弱口令

logging:
  level:
    ROOT: INFO
    com.misu: DEBUG

server:
  servlet:
    context-path: /fileServer

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  datasource:
    file-server:
      type: com.zaxxer.hikari.HikariDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      # sessionVariables=sql_mode=NO_ENGINE_SUBSTITUTION 关掉 MySQL 8 的严格模式，
      # 否则 Hibernate 生成的 `datetime(6) default CURRENT_TIMESTAMP` 会被拒绝
      # （MySQL 8 默认开启 STRICT_TRANS_TABLES + NO_ZERO_DATE）。
      url: jdbc:mysql://127.0.0.1:3316/misu_file_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&useSSL=false&sessionVariables=sql_mode%3DNO_ENGINE_SUBSTITUTION
      username: root
      password: root
      hikari:
        maximum-pool-size: 8
        minimum-idle: 2
    # 聊天模块第二数据源（misu_chat 库）：会话 / 成员 / 消息持久化
    chat:
      type: com.zaxxer.hikari.HikariDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://127.0.0.1:3316/misu_chat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true&useSSL=false&sessionVariables=sql_mode%3DNO_ENGINE_SUBSTITUTION
      username: root
      password: root
      hikari:
        maximum-pool-size: 8
        minimum-idle: 2

  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # 本地 dev：自动 update 建表 / 加列
        # 这里走 spring.jpa.properties.hibernate.hbm2ddl.auto，而不是
        # spring.jpa.hibernate.ddl-auto —— 因为本服务用了自定义的
        # LocalContainerEntityManagerFactoryBean（FileServerDataSourceConfig），
        # Spring Boot 不会把高层 spring.jpa.hibernate.* 映射进自定义 EMF。
        hbm2ddl:
          auto: update
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# JWT —— 必须与 misu-account 一致
token:
  header: Authorization
  cookieName: User-Token
  expireTtl: 86400000
  refreshExpireTtl: 2592000000
  secret: vDW2/YL5VGg3wAub8ohhz2l+OUjtYa1k4twm4nNNzAY=

# 聊天模块（旧名 bot；运行时配置仍走 bot.*，便于区分 bb 连接 vs chat 数据层）
bot:
  enable: true
  serverPort: 30201
  # 浏览器直接连这个 WS 服务端口（不经网关）；本地即 file-server 进程内的 WS 服务
  serverWebSocketUrl: ws://127.0.0.1:30201
  token:
    expireTtl: 300000
  # 本地无 bb 上游：用不可达地址占位。SDK 后台每 5s 重连一次，连不上不影响消息落库，
  # 只是 bb 不会回复（前端会收到 bot_offline）。要测 bb 回复需填真实 bb 凭据。
  bbConnection:
    url: ws://127.0.0.1:39999
    appId: dev
    secret: dev
    # bb-bot HTTP 基址（用量查询 REST），本地指向 bbtest 的 18199；prod 用集群内地址。内网直连不走代理。
    httpUrl: http://127.0.0.1:18199
    # 对应 bb 侧 ai-agent.billing.queryApiToken
    usageApiToken: local-usage-token

# 聊天数据层 / 群聊参数（chat.*）
chat:
  # 本地无 bb 上游：开启 mock 机器人回复（走真实落库+广播+流式），私聊必回、群里 @bot 触发
  mockBotReply: true
  botUserId: bot
  # 群里没 @bot 时的小概率随机插话（本地演示可调大，如 0.3）
  groupRandomReplyRate: 0.1
  # 群文件磁盘存储目录（消息只放引用，文件不再 base64 进库）
  file:
    path: ${user.home}/.misu-dev/files/chat/

misu:
  static:
    path: ${user.home}/.misu-dev/files/

# 文件存储路径（程序运行时会自动创建子目录 transcode/preview/...）
file-server:
  path: ${user.home}/.misu-dev/files/file-server/
  qBitTorrent:
    remoteEnable: false
    apiBaseUrl: http://127.0.0.1:30103
    username: admin
    password: ""
    localPath: ${user.home}/.misu-dev/files/torrents/
    remoteDownloadPath: /downloads

# 视频转码（本地 dev 默认开启，需要 ffmpeg 在 PATH 中；不需要可关掉）
video:
  transcode:
    enabled: true
    max-bytes: 1610612736
    queue-dir: ${file-server.path}transcode-queue
    status-dir: ${file-server.path}transcode-status
    transcode-dir: ${file-server.path}transcode
    preview-dir: ${file-server.path}preview/video
    max-height: 1080
    crf: 28
    preset: medium
    audio-bitrate: 128k
    profile-version: hevc-aac-mp4-1080p-v1
    # 直通探测：worker 领到 .task 后先 ffprobe，如果源文件已经是 Safari 可播放的
    # HEVC + hvc1 + AAC + MP4 + <=max-height + <=max-bitrate，跳过 libx265 转码、
    # 只截预览封面，状态标记为 PASSTHROUGH。FE 播放时直接拉源文件流。
    passthrough:
      enabled: true
      # 5 Mbps；超过此码率认为还有压缩空间，强制走 libx265 转码
      max-bitrate: 5000000
    # 容器化 worker 的管理 API 地址；prod 默认 misu-ffmpeg-worker.misu-server.svc.cluster.local:18765
    # 本地 dev 跑 Mac 上的 worker 时可以指向 127.0.0.1:18765
    worker:
      base-url: http://127.0.0.1:18765
    # 自动转码：定时扫描所有视频，给尚未转码的自动入队（无需手动进入文件夹触发）
    autoScan:
      enabled: true
      # 本地 dev 每 2 分钟扫一次，便于观察效果
      cron: "0 */2 * * * ?"

# 文件下载/上传/映射 GC（沿用 application.yml 默认值）
file:
  download:
    directory:
      maxBytes: 209715200
      maxFiles: 1000
  upload:
    lock:
      expireMillis: 1800000
      clean:
        cron: 0 */10 * * * ?
  mapping:
    gc:
      cron: 0 0 4 * * ?
      retentionDays: 7

# 文件客户端：本地文件系统
fileClient:
  type: local

# 业务线程池
fileServer:
  corePoolSize: 5
  maxPoolSize: 10
  queueCapacity: 1000
