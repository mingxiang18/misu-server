# 本地开发联调环境 — 中间件
#
# 启动：scripts/dev/dev.sh up        （会自动调用本文件 + seed）
# 直接：docker compose -f docker-compose.local.yml up -d
#       docker compose -f docker-compose.local.yml down -v
#
# 注意：仅供本地 dev 使用，账号密码均为弱口令，不要照搬到任何非本机环境。

name: misu-local

services:
  mysql:
    image: mysql:8.0
    container_name: misu-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=1
    ports:
      - "3316:3306"     # 与 misu-web/application.yml 保持一致，避免与系统 3306 冲突
    volumes:
      - misu-mysql-data:/var/lib/mysql
      - ./scripts/dev/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  nacos:
    image: nacos/nacos-server:v2.3.2
    # Nacos 2.3.x 仅有官方 amd64 镜像；Apple Silicon 走 Rosetta 翻译。
    # 如已升到 Nacos 2.4+（多架构）可去掉本行。
    platform: linux/amd64
    container_name: misu-nacos-local
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: misu-local-identity
      NACOS_AUTH_IDENTITY_VALUE: misu-local-secret
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"     # HTTP/OpenAPI
      - "9848:9848"     # gRPC client
      - "9849:9849"     # gRPC server
    volumes:
      - misu-nacos-data:/home/nacos/data
      - misu-nacos-logs:/home/nacos/logs
    healthcheck:
      # /nacos/v1/console/health/readiness 在 v2.3.x 仍可用，未鉴权
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  misu-mysql-data:
  misu-nacos-data:
  misu-nacos-logs:
