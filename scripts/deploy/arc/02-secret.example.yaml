# GitHub App 凭据 —— 不要提交到 git。把本文件复制为 02-secret.yaml 后填值并 apply。
#
# 创建 GitHub App 的步骤见 ./README.md §3。
# 必需的三个值都从 GitHub App 设置页拿：
#   - App ID（数字，App 设置页顶部）
#   - Installation ID（数字，把 App 安装到 misu-server 这个 repo 后在 URL 里能看到：
#     https://github.com/settings/installations/<这里就是 ID>）
#   - Private key（在 App 设置页 "Private keys" 区生成并下载的 .pem 文件全文）
#
# 注意 stringData 里 private key 必须**整段 PEM**（含 -----BEGIN / END 行），
# 缩进沿用 YAML 块标量（| 后跟两空格缩进）。
---
apiVersion: v1
kind: Secret
metadata:
  name: gh-app-creds
  namespace: arc-runners
type: Opaque
stringData:
  github_app_id: "123456"
  github_app_installation_id: "12345678"
  github_app_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_ME_WITH_PEM_CONTENTS
    -----END RSA PRIVATE KEY-----
