# Helm values for chart: gha-runner-scale-set
# 安装命令见 ./README.md §5。
githubConfigUrl: "https://github.com/mingxiang18/misu-server"
githubConfigSecret: gh-app-creds

# 一次只允许一个 build，避免和 prod pod 抢资源
minRunners: 0
maxRunners: 1

# 这个名字就是 workflow 里 `runs-on:` 写的值
runnerScaleSetName: misu-runners

# 不用 dind / kubernetes 容器模式 —— 我们用自建镜像，工具全在里面
containerMode:
  type: ""

# listener pod 也钉在 misu-maco —— 它跟 controller 同款镜像
# (ghcr.io/actions/gha-runner-scale-set-controller:0.9.3)，
# misu-maco 上 containerd 有代理而且镜像已经缓存了
listenerTemplate:
  spec:
    nodeSelector:
      kubernetes.io/hostname: misu-maco
    containers:
      - name: listener

# runner pod 模板：钉在 misu-maco 节点 + 挂 maven cache + 挂 nginx html dir
template:
  spec:
    serviceAccountName: misu-deployer
    nodeSelector:
      kubernetes.io/hostname: misu-maco
    securityContext:
      # runner 以 root 跑：Kaniko 解压 base image rootfs 时要 chown /bin 等系统
      # 目录，必须 uid 0。k8s pod 的 root 是 namespaced，不等于宿主 root，加上
      # 没 privileged 没 hostNetwork，对宿主依然隔离。fsGroup 1001 保留是为了
      # 让以前 chown 1001:1001 的 hostPath 文件被新建对象继续以 gid 1001 共存。
      runAsUser: 0
      fsGroup: 1001
    containers:
      - name: runner
        image: 10.8.0.26:30500/misuaa/misu-ci-runner:latest
        imagePullPolicy: Always
        # 临时：包一层 tee 把 stderr+stdout 抓到 hostPath，方便 pod 死后 misu-maco 上读
        # 跑通后可以改回 ["/home/runner/run.sh"]
        command:
          - sh
          - -c
          - |
            mkdir -p /mnt/misu/ci/runner-debug
            ts=$(date +%s)
            /home/runner/run.sh 2>&1 | tee /mnt/misu/ci/runner-debug/runner-$ts.log
            echo "exit_code=$?" >> /mnt/misu/ci/runner-debug/runner-$ts.log
        env:
          # actions-runner agent 默认拒绝以 root 启动，必须显式 opt-in
          - name: RUNNER_ALLOW_RUNASROOT
            value: "1"
          # 让 git checkout 不要 LFS / 提示
          - name: GIT_TERMINAL_PROMPT
            value: "0"
          # ⚠️ root 运行时 HOME 默认变 /root；同时 actions-runner agent 给每个
          # step 用临时 HOME。所以 HOME 这个 env 不够，mvn 还是会找 /root/.m2 或临时目录。
          - name: HOME
            value: /home/runner
          # MAVEN_OPTS 走 JVM 系统属性，**强制锁** mvn 用 PVC 挂载的 repo，
          # 任何 HOME 改写都干涉不到。bb-bot-sdk 自定义版本在 PVC 上，必须用这条。
          - name: MAVEN_OPTS
            value: "-Dmaven.repo.local=/home/runner/.m2/repository"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
        volumeMounts:
          - name: maven-repo
            mountPath: /home/runner/.m2/repository
          - name: ui-html
            mountPath: /mnt/misu/misu-server/html
          - name: ci-shared
            mountPath: /mnt/misu/ci
          - name: workspace
            mountPath: /home/runner/_work
    volumes:
      - name: maven-repo
        persistentVolumeClaim:
          claimName: misu-ci-maven-repo
      - name: ui-html
        hostPath:
          path: /mnt/misu/misu-server/html
          type: Directory
      - name: ci-shared
        hostPath:
          path: /mnt/misu/ci
          type: DirectoryOrCreate
      # workspace 持久化到 hostPath：第一次 run 之后，_work 里会有
      #   _work/_actions/   <- 缓存 actions/checkout、dorny/paths-filter 解压结果
      #   _work/_tool/      <- 工具链缓存（setup-java 之类的）
      #   _work/_temp/      <- 临时文件
      #   _work/misu-server/misu-server/   <- 仓库 working tree + .git
      # 下一次 actions/checkout@v4 看到 .git 存在，做 git fetch（不是 clone），快得多。
      # 注意：maxRunners=1 保证不会有并发 runner 同时改 workspace。
      - name: workspace
        hostPath:
          path: /mnt/misu/ci/runner-work
          type: Directory
