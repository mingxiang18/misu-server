apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: kuboard
spec:
  template:
    spec:
      containers:
        - name: headlamp
          # Headlamp documents -base-url as the supported Kubernetes setting.
          # Keep -in-cluster so the existing service-account login remains in use.
          args:
            - -in-cluster
            - -proxy-auth=true
            - -plugins-dir=/headlamp/plugins
            - -base-url
            - /ops/headlamp
          readinessProbe:
            httpGet:
              path: /ops/headlamp/
              port: 4466
          livenessProbe:
            httpGet:
              path: /ops/headlamp/
              port: 4466
