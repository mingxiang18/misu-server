---
# misu-gateway Deployment + Service。ConfigMap 见 misu-gateway-config.yaml。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: misu-gateway
  namespace: misu-server
  labels: { app: misugateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: misugateway }
  template:
    metadata:
      labels: { app: misugateway }
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [misu-maco]
      terminationGracePeriodSeconds: 30
      containers:
        - name: misu-gateway
          # 由 release.sh 用 envsubst 渲染 REGISTRY_PULL + IMAGE_TAG
          image: ${REGISTRY_PULL}/misuaa/misu-gateway:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 30260 }
          env:
            - { name: JAVA_XMX, value: "512m" }
            - { name: JAVA_XMS, value: "256m" }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { cpu: 2,    memory: 1Gi }
          startupProbe:
            tcpSocket: { port: 30260 }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: 30260 }
            periodSeconds: 30
          readinessProbe:
            tcpSocket: { port: 30260 }
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /app/application-prod.yaml, subPath: application-prod.yaml }
      volumes:
        - name: config
          configMap: { name: misu-gateway-config }
---
apiVersion: v1
kind: Service
metadata:
  name: misu-gateway
  namespace: misu-server
spec:
  type: NodePort
  selector: { app: misugateway }
  ports:
    - { port: 30260, targetPort: 30260, nodePort: 30260 }
