apiVersion: v1
kind: ConfigMap
metadata:
  name: misu-server-nginx-config
  namespace: misu-server
data:
  nginx.conf: |
    user nginx;
    worker_processes 1;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events { worker_connections 1024; }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      map $http_cookie $ops_cookie_count {
        default 0;
        ~*MISU_OPS_SESSION=.*MISU_OPS_SESSION= 2;
        ~*MISU_OPS_SESSION= 1;
      }
      map $upstream_http_set_cookie $ops_set_cookie_present {
        default 1;
        '' 0;
      }
      log_format main '$remote_addr - [$time_local] "$request_method $uri" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'ops_cookie_count=$ops_cookie_count ops_set_cookie=$ops_set_cookie_present';
      access_log /var/log/nginx/access.log main;
      sendfile on;
      keepalive_timeout 65;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      upstream misu_ops {
        server misu-ops:30264;
        keepalive 16;
      }

      server {
        listen 30110;
        # Keep edge redirects relative so the internal listener and port are
        # never exposed in a browser Location header.
        absolute_redirect off;

        location = /nacos {
          return 308 /nacos/;
        }

        location ^~ /nacos/ {
          proxy_pass http://misu_ops;
          proxy_http_version 1.1;
          proxy_set_header Host server.misu.chat;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_buffering off;
        }

        location = /ops/headlamp {
          return 308 /ops/headlamp/;
        }

        location ^~ /ops/headlamp/ {
          proxy_pass http://misu_ops;
          proxy_http_version 1.1;
          proxy_set_header Host server.misu.chat;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          # Pod logs use a long-lived HTTP response when follow=true. Keep
          # the edge hop open for the same duration as the sidecar hop.
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_buffering off;
        }

        location = /ops/qbittorrent {
          return 308 /ops/qbittorrent/;
        }

        # Sidecar-only endpoints must never fall through to the SPA fallback.
        location ^~ /ops/internal/ {
          return 404;
        }

        location ^~ /ops/qbittorrent/ {
          proxy_pass http://misu_ops;
          proxy_http_version 1.1;
          proxy_set_header Host server.misu.chat;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_buffering off;
        }

        location ^~ /ops/ws/ssh/ {
          proxy_pass http://misu_ops;
          proxy_http_version 1.1;
          proxy_set_header Host server.misu.chat;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          proxy_buffering off;
        }

        location / {
          root /home/misu/misu-server/html;
          index index.html;
          try_files $uri $uri/ /index.html;
        }

        location /healthz {
          access_log off;
          return 200 "ok\n";
        }
      }
    }
