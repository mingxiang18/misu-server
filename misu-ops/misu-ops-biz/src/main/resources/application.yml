server:
  address: ${OPS_BIND_ADDRESS:127.0.0.1}
  port: ${OPS_SERVER_PORT:30264}
  servlet:
    context-path: /ops

spring:
  application:
    name: misu-ops

ops:
  account-base-url: ${OPS_ACCOUNT_BASE_URL:http://localhost:30261/account}
  nacos-url: ${OPS_NACOS_URL:}
  headlamp-url: ${OPS_HEADLAMP_URL:}
  nacos-upstream-url: ${OPS_NACOS_UPSTREAM_URL:}
  headlamp-upstream-url: ${OPS_HEADLAMP_UPSTREAM_URL:}
  qbittorrent-url: ${OPS_QBITTORRENT_URL:https://server.misu.chat/ops/qbittorrent/}
  qbittorrent-username: ${OPS_QBITTORRENT_USERNAME:}
  qbittorrent-password: ${OPS_QBITTORRENT_PASSWORD:}
  public-base-url: ${OPS_PUBLIC_BASE_URL:}
  proxy-shared-secret: ${OPS_PROXY_SHARED_SECRET:}
  known-hosts-path: ${OPS_KNOWN_HOSTS_PATH:}
  private-key-path: ${OPS_PRIVATE_KEY_PATH:}
  cookie-secure: ${OPS_COOKIE_SECURE:true}
  ssh-handshake-ttl-seconds: ${OPS_SSH_HANDSHAKE_TTL_SECONDS:30}
  max-ssh-sessions: ${OPS_MAX_SSH_SESSIONS:4}
  max-console-tickets: ${OPS_MAX_CONSOLE_TICKETS:128}
  max-console-tickets-per-user: ${OPS_MAX_CONSOLE_TICKETS_PER_USER:8}
  max-console-sessions: ${OPS_MAX_CONSOLE_SESSIONS:32}
  max-console-sessions-per-user: ${OPS_MAX_CONSOLE_SESSIONS_PER_USER:4}
  max-console-web-sockets: ${OPS_MAX_CONSOLE_WEBSOCKETS:8}
  console-web-socket-connect-timeout-millis: ${OPS_CONSOLE_WS_CONNECT_TIMEOUT_MILLIS:5000}
  database:
    enabled: ${OPS_DATABASE_ENABLED:false}
    url: ${OPS_DATABASE_URL:}
    username: ${OPS_DATABASE_USERNAME:}
    password: ${OPS_DATABASE_PASSWORD:}
    allowed-schemas: ${OPS_DATABASE_ALLOWED_SCHEMAS:}
    maximum-pool-size: ${OPS_DATABASE_MAX_POOL_SIZE:4}
    connection-timeout-millis: ${OPS_DATABASE_CONNECTION_TIMEOUT_MILLIS:2000}
    idle-timeout-millis: ${OPS_DATABASE_IDLE_TIMEOUT_MILLIS:60000}
    query-timeout-seconds: ${OPS_DATABASE_QUERY_TIMEOUT_SECONDS:5}
    max-concurrent: ${OPS_DATABASE_MAX_CONCURRENT:4}
    max-page-size: ${OPS_DATABASE_MAX_PAGE_SIZE:100}
  main-cookie-names: ${OPS_MAIN_COOKIE_NAMES:User-Token,User-Refresh-Token,User-Info}
  allowed-origins: ${OPS_ALLOWED_ORIGINS:https://server.misu.chat}
  ssh:
    user: ${OPS_SSH_USER:root}
    port: ${OPS_SSH_PORT:22}
    nodes:
      master:
        id: master
        name: 主节点
        host: ${OPS_MASTER_HOST:10.8.0.1}
        port: ${OPS_MASTER_PORT:22}
      worker:
        id: worker
        name: 工作节点
        host: ${OPS_WORKER_HOST:10.8.0.26}
        port: ${OPS_WORKER_PORT:22}
token:
  secret: ${OPS_TOKEN_SECRET}
