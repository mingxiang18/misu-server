# Tomcat
server:
  port: 30262
  servlet:
    context-path: /fileServer

# File download
file:
  download:
    directory:
      # Limit temporary ZIP downloads to avoid exhausting small outbound bandwidth.
      maxBytes: 209715200
      maxFiles: 1000
  upload:
    lock:
      # 上传分片合并锁超时时间（毫秒）
      expireMillis: 1800000
      # 每 10 分钟清理一次超时锁
      clean:
        cron: 0 */10 * * * ?
    # Q3：扩展名黑名单，命中即拒绝；防止上传可执行 / 脚本类作 XSS / 分发跳板
    blockedExtensions: exe,bat,cmd,com,scr,msi,sh,ps1,vbs,vbe,jse,wsf,wsh,hta,jar,reg
    # Q8：单用户上传并发上限（permit 数）；抢不到 acquireTimeoutMillis 即报错
    maxConcurrentPerUser: 8
    acquireTimeoutMillis: 3000
  mapping:
    gc:
      # 每天 04:00 清理已逻辑删除且无有效映射引用的物理文件
      cron: 0 0 4 * * ?
      # 逻辑删除后的保留天数，避免误删
      retentionDays: 7
  # M5：私人空间每用户配额（字节），<= 0 表示不限制；本期仅做展示，不做硬性拦截
  quota:
    privateBytesPerUser: -1
  # M18：版本历史。大文件不快照（节省磁盘）；每文件最多保留 N 个版本
  version:
    maxBytesPerSnapshot: 52428800  # 50 MB
    maxVersionsPerFile: 5

# WebDAV：用户私有目录（openType=0）的可读写挂载端点，跑在独立端口、不经网关
webdav:
  server:
    # WebDAV 专用端口（独立 Tomcat 连接器）
    port: 30263
  auth:
    # Basic Auth 凭证校验结果的本地缓存时长（秒），规避每请求 Feign + BCrypt 开销
    cache-ttl-seconds: 300
  lock:
    # 内存写锁默认超时（秒）
    timeout-seconds: 600
  # 单次 PUT 上传字节上限（10 GB）
  max-upload-bytes: 10737418240

video:
  transcode:
    enabled: true
    # 1.5GB. Videos larger than this are not transcoded or played online by default.
    max-bytes: 1610612736
    queue-dir: ${file-server.path}transcode-queue
    status-dir: ${file-server.path}transcode-status
    transcode-dir: ${file-server.path}transcode
    preview-dir: ${file-server.path}preview/video
    # HEVC + AAC MP4. Keep original resolution up to 1080p and reduce size with quality-based encoding.
    max-height: 1080
    crf: 28
    preset: medium
    audio-bitrate: 128k
    profile-version: hevc-aac-mp4-1080p-v1
    # Q8：转码队列总长（waiting + running）上限，超过则不再排队新任务
    maxQueueLength: 50

# Spring
spring:
  application:
    # 应用名称
    name: misu-file-server
  profiles:
    # 环境配置
    active: local

# Q5 可观测：暴露 actuator + Prometheus 抓取端点
# actuator 跑在独立端口（30362）避免与 misu-security PermitAllUrlProperties
# 拿 RequestMappingHandlerMapping 时和业务 servlet context 的 mapping 冲突。
management:
  server:
    port: 30362
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
