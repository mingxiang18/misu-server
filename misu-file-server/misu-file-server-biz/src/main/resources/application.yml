# Tomcat
server:
  port: 30262
  servlet:
    context-path: /fileServer

# File download
file:
  download:
    directory:
      # Limit temporary ZIP downloads to avoid exhausting small outbound bandwidth.
      maxBytes: 209715200
      maxFiles: 1000
  upload:
    lock:
      # 上传分片合并锁超时时间（毫秒）
      expireMillis: 1800000
      # 每 10 分钟清理一次超时锁
      clean:
        cron: 0 */10 * * * ?
  mapping:
    gc:
      # 每天 04:00 清理已逻辑删除且无有效映射引用的物理文件
      cron: 0 0 4 * * ?
      # 逻辑删除后的保留天数，避免误删
      retentionDays: 7

video:
  transcode:
    enabled: true
    # 1.5GB. Videos larger than this are not transcoded or played online by default.
    max-bytes: 1610612736
    queue-dir: ${file-server.path}transcode-queue
    status-dir: ${file-server.path}transcode-status
    transcode-dir: ${file-server.path}transcode
    preview-dir: ${file-server.path}preview/video
    # HEVC + AAC MP4. Keep original resolution up to 1080p and reduce size with quality-based encoding.
    max-height: 1080
    crf: 28
    preset: medium
    audio-bitrate: 128k
    profile-version: hevc-aac-mp4-1080p-v1

# Spring
spring:
  application:
    # 应用名称
    name: misu-file-server
  profiles:
    # 环境配置
    active: local
